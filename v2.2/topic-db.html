/* ===== 全局重置 ===== */
html, body, #app { height: 100%; margin: 0; padding: 0; }
body {

/* ===== 主布局：左右分栏 ===== */
.kb-chat {

}

/* ===== 左侧面板 ===== */
.tp-left-panel {
  width: 180px;

  align-items: center;
  cursor: pointer;
}
.tp-header .header-logo img {

  width: auto;
}

  width: 28px;
  height: 28px;

  align-items: center;
  justify-content: center;

  border: none;
  padding: 0;
  transition: background 0.15s;
}
.tp-header .collapse-btn:hover {
  background: #f0f0f0;
}
.tp-header .collapse-btn svg {
  width: 20px;
  height: 20px;
  color: #666;
}

  width: 60px;
  min-width: 60px;
}
.tp-left-panel.collapsed .tp-header .header-logo img {
  width: 36px;

}
.tp-left-panel.collapsed .tp-header .collapse-btn {
  display: none;
}
.tp-left-panel.collapsed .tp-header:hover .collapse-btn {

  left: 50%;
  transform: translate(-50%, -50%);

  height: 36px;

.tp-left-panel.collapsed .tp-header:hover .header-logo img {

}
.tp-left-panel.collapsed .tp-nav-item span {
  display: none;
}
.tp-left-panel.collapsed .tp-nav-item {
  justify-content: center;
  padding: 12px 0;
}
.tp-left-panel.collapsed .tp-user-section {

  padding: 14px 0;
}
.tp-left-panel.collapsed .tp-user-section .user-name,
.tp-left-panel.collapsed .tp-user-section .user-arrow {

}

function tdCheckClueTruncation(container) {
  var root = container || document;
  var cards = root.querySelectorAll('.td-clue-card');
  cards.forEach(function(card) {
    var original = card.querySelector('.td-clue-original');
    if (!original) return;
    if (original.scrollHeight <= original.clientHeight + 1) {
      card.classList.add('no-clamp');
    } else {
      card.classList.remove('no-clamp');
    }
  });
}

function toggleDocMore(btn) {
  var wrap = btn.parentElement;
  var wasOpen = wrap.classList.contains('open');
  document.querySelectorAll('.td-doc-more-wrap.open').forEach(function(w) { w.classList.remove('open'); });
  if (!wasOpen) wrap.classList.add('open');
}

function tdDocAction(type, id) {
  document.querySelectorAll('.td-doc-more-wrap.open').forEach(function(w) { w.classList.remove('open'); });
  var doc = tdDocs.filter(function(d) { return d.id === id; })[0];
  if (!doc) return;
  if (type === 'cite') {
    alert('已生成引用：\n' + doc.title + '\n' + doc.authors + '. ' + doc.source + ', ' + doc.date + '.');
  } else if (type === 'move') {
    alert('移动到其他专题（功能建设中）');
  } else if (type === 'remove') {
    if (confirm('确定要移除文献「' + doc.title + '」吗？')) {
      tdDocs = tdDocs.filter(function(d) { return d.id !== id; });
      if (tdCurrentDoc && tdCurrentDoc.id === id) tdCurrentDoc = null;
      tdRenderDocs();
    }
  }
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.td-doc-more-wrap')) {
    document.querySelectorAll('.td-doc-more-wrap.open').forEach(function(w) { w.classList.remove('open'); });

});

function tdRenderClues() {
  var list = document.getElementById('td-clue-list');
  if (!list) return;
  var tabCount = document.getElementById('td-clue-tab-count');
  if (tabCount) tabCount.textContent = tdClues.length;
  if (tdClues.length === 0) {
    list.innerHTML = '<div class="td-empty"><i class="ri-lightbulb-line"></i><p>暂无线索</p></div>';
    return;
  }
  var html = '';
  tdClues.forEach(function(c) {
    html += tdBuildClueCard(c);
  });
  list.innerHTML = html;
  requestAnimationFrame(function() { tdCheckClueTruncation(list); });
}

function tdRenderViews() {
  var list = document.getElementById('td-view-list');
  if (!list) return;
  var viewCount = document.getElementById('td-view-count');
  if (viewCount) viewCount.textContent = tdViews.length;
  var viewTabCount = document.getElementById('td-view-tab-count');
  if (viewTabCount) viewTabCount.textContent = tdViews.length;
  if (tdViews.length === 0) {
    list.innerHTML = '<div class="td-empty"><i class="ri-flashlight-line"></i><p>暂无观点<br>可手动添加或调用 AI 生成</p></div>';
    return;
  }
  var html = '';
  tdViews.forEach(function(v, idx) {
    html +=
      '<div class="td-view-card">' +
        '<div class="td-view-header">' +
          '<div class="td-view-title">' + v.title + '</div>' +
        '</div>' +
        '<div class="td-view-desc">' + v.desc + '</div>' +
        '<div class="td-view-meta">' +
          '<span class="td-view-meta-label">线索数量：</span>' +
          '<span class="td-view-clue-count">' + v.clueCount + '</span>' +
          '<span class="td-clue-time" style="margin-left:auto;">' + v.time + '</span>' +
        '</div>' +
      '</div>';
  });
  list.innerHTML = html;
}

function switchWorkTab(tab) {
  document.querySelectorAll('.td-main-tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  ['clues', 'views', 'graph'].forEach(function(p) {
    var el = document.getElementById('td-panel-' + p);
    if (el) el.classList.toggle('is-hidden', p !== tab);
  });
}

// ===== 三栏宽度拖拽调整 =====
(function() {
  var MIN_LEFT = 240;
  var MAX_LEFT = 600;
  var MIN_RIGHT = 240;
  var MAX_RIGHT = 600;

  document.querySelectorAll('.td-resizer').forEach(function(resizer) {
    var targetId = resizer.getAttribute('data-target');
    var direction = resizer.getAttribute('data-direction');
    var startX = 0, startWidth = 0, target = null;

    resizer.addEventListener('mousedown', function(e) {
      target = document.getElementById(targetId);
      if (!target) return;
      startX = e.clientX;
      startWidth = target.offsetWidth;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
      if (!target) return;
      var dx = e.clientX - startX;
      var newWidth = direction === 'left' ? (startWidth + dx) : (startWidth - dx);
      var minW = direction === 'left' ? MIN_LEFT : MIN_RIGHT;
      var maxW = direction === 'left' ? MAX_LEFT : MAX_RIGHT;
      newWidth = Math.max(minW, Math.min(maxW, newWidth));
      target.style.width = newWidth + 'px';
      target.style.minWidth = newWidth + 'px';
    });

    document.addEventListener('mouseup', function() {
      if (!target) return;
      target = null;
      resizer.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });
  });
})();

// ===== AI 助手固定/取消固定 =====
function toggleAiPin() {
  var panel = document.getElementById('td-ai-panel');
  var btn = document.getElementById('td-ai-pin-btn');
  var resizer = document.querySelector('.td-resizer-right');
  var icon = btn.querySelector('i');
  var isFloating = panel.classList.contains('is-floating');
  if (isFloating) {
    // 恢复固定
    panel.classList.remove('is-floating');
    panel.style.width = '';
    panel.style.minWidth = '';
    panel.style.height = '';
    panel.style.top = '';
    panel.style.left = '';
    resizer.classList.remove('hidden');
    btn.classList.add('pinned');
    icon.className = 'ri-pushpin-line';
    btn.title = '取消固定';
  } else {
    // 取消固定 - 悬浮在右下角
    panel.classList.add('is-floating');
    resizer.classList.add('hidden');
    btn.classList.remove('pinned');
    icon.className = 'ri-pushpin-line';
    btn.title = '固定到右侧';
  }
}

function closeAiPanel() {
  var panel = document.getElementById('td-ai-panel');
  var resizer = document.querySelector('.td-resizer-right');
  panel.classList.remove('is-floating');
  panel.classList.add('is-collapsed');
  resizer.classList.add('hidden');
  panel.style.width = '';
  panel.style.minWidth = '';
  panel.style.height = '';
  panel.style.top = '';
  panel.style.left = '';
  panel.style.cursor = 'pointer';
}

function expandAiPanel() {
  var panel = document.getElementById('td-ai-panel');
  var resizer = document.querySelector('.td-resizer-right');
  var btn = document.getElementById('td-ai-pin-btn');
  var icon = btn.querySelector('i');
  panel.classList.remove('is-collapsed');
  resizer.classList.remove('hidden');
  btn.classList.add('pinned');
  icon.className = 'ri-pushpin-line';
  btn.title = '取消固定';
  panel.style.cursor = '';
}

// 让悬浮态可拖动
(function() {
  var panel = document.getElementById('td-ai-panel');
  var header = panel.querySelector('.td-ai-header');
  var dragging = false, startX, startY, startLeft, startTop;
  header.addEventListener('mousedown', function(e) {
    if (panel.classList.contains('is-collapsed')) return;
    if (!panel.classList.contains('is-floating')) return;
    if (e.target.closest('.td-ai-header-btn')) return;
    dragging = true;
    var rect = panel.getBoundingClientRect();
    startLeft = rect.left; startTop = rect.top;
    startX = e.clientX; startY = e.clientY;
    panel.style.bottom = 'auto';
    panel.style.right = 'auto';
    panel.style.left = startLeft + 'px';
    panel.style.top = startTop + 'px';
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var dx = e.clientX - startX, dy = e.clientY - startY;
    var newLeft = startLeft + dx, newTop = startTop + dy;
    var maxLeft = window.innerWidth - panel.offsetWidth;
    var maxTop = window.innerHeight - panel.offsetHeight;
    newLeft = Math.max(0, Math.min(maxLeft, newLeft));
    newTop = Math.max(0, Math.min(maxTop, newTop));
    panel.style.left = newLeft + 'px';
    panel.style.top = newTop + 'px';
  });
  document.addEventListener('mouseup', function() { dragging = false; });
})();
