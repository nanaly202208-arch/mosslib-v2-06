var dateKeys = ["2026-07-02","2026-07-01","2026-06-12","2026-06-11","2026-06-10","2026-06-09","2026-06-08","2026-05-29","2026-05-28"];
var activeDate = "2026-07-02";

function getWeekdayByKey(key) {
    var map = {
        "2026-05-28":"周四","2026-05-29":"周五",
        "2026-06-08":"周一","2026-06-09":"周二",
        "2026-06-10":"周三","2026-06-11":"周四","2026-06-12":"周五",
        "2026-07-01":"周三","2026-07-02":"周四"
    };
    return map[key] || "";
}

var monthGroupState = {};

function getMonthLabel(key) {
    var parts = key.split('-');
    return parts[0] + '年' + parseInt(parts[1], 10) + '月';
}

function renderDateList() {
    var container = document.getElementById("dateListContainer");
    if(!container) return;
    var html = '';
    var todayKey = new Date().toISOString().slice(0, 10);

    // 按月份分组
    var groups = {};
    dateKeys.forEach(function(key) {
        var monthKey = key.slice(0, 7);
        if (!groups[monthKey]) groups[monthKey] = [];
        groups[monthKey].push(key);
    });

    var monthKeys = Object.keys(groups);
    monthKeys.forEach(function(monthKey, idx) {
        if (monthGroupState[monthKey] === undefined) {
            monthGroupState[monthKey] = (idx === 0);
        }
        var isExpanded = monthGroupState[monthKey];
        var collapsedClass = isExpanded ? '' : ' collapsed';
        var activeMonth = activeDate.slice(0, 7);
        var activeClass = (monthKey === activeMonth) ? ' active' : '';

        html +=
             '<div class="date-month-group" data-month="' + monthKey + '">' +
                 '<div class="month-group-header' + collapsedClass + activeClass + '">' +
                     '<span class="month-group-title-icon">' +
                         '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#7a7b7b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' +
                         '<span class="month-group-title">' + getMonthLabel(groups[monthKey][0]) + '</span>' +
                     '</span>' +
                     '<div class="month-group-right">' +
                         '<span class="month-group-count">' + groups[monthKey].length + '份</span>' +
                         '<svg class="month-group-toggle" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
                     '</div>' +
                 '</div>' +
                 '<div class="month-group-body" style="max-height:' + (isExpanded ? 'none' : '0px') + '">';

        groups[monthKey].forEach(function(key) {
            var dateObj = reportsDB[key] || { fullDate: key.slice(5).replace('-','/'), weekday: getWeekdayByKey(key) };
            var parts = key.split('-');
            var displayDate = '每日晨报 ' + parseInt(parts[1], 10) + '/' + parseInt(parts[2], 10);
            var weekStr = dateObj.weekday || "";
            var isActive = (key === activeDate);
            var isToday = (key === todayKey);
            if (isActive) {
                html +=
                    '<div class="date-item active" data-date="' + key + '">' +
                        '<svg class="date-item-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>' +
                        '<div class="date-num">' + displayDate + '</div>' +
                        '<div class="date-week">' + weekStr + (isToday ? ' <span class="today-tag">今天</span>' : '') + '</div>' +
                    '</div>';
            } else {
                html +=
                    '<div class="date-item" data-date="' + key + '">' +
                        '<svg class="date-item-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>' +
                        '<div class="date-num">' + displayDate + '</div>' +
                        '<div class="date-week">' + weekStr + (isToday ? ' <span class="today-tag">今天</span>' : '') + '</div>' +
                    '</div>';
            }
        });

        html +=
                '</div>' +
            '</div>';
    });

    container.innerHTML = html;

    // 月份分组头点击展开/收起
     container.querySelectorAll('.month-group-header').forEach(function(header) {
         header.addEventListener('click', function(e) {
             var group = header.closest('.date-month-group');
             var monthKey = group.getAttribute('data-month');
             var body = group.querySelector('.month-group-body');
             var isCollapsed = body.style.maxHeight === '0px' || body.style.maxHeight === '0';
             if (isCollapsed) {
                 body.style.maxHeight = body.scrollHeight + 'px';
                 header.classList.remove('collapsed');
                 monthGroupState[monthKey] = true;
             } else {
                 body.style.maxHeight = body.scrollHeight + 'px';
                 requestAnimationFrame(function() {
                     body.style.maxHeight = '0px';
                     header.classList.add('collapsed');
                     monthGroupState[monthKey] = false;
                 });
             }
         });
     });

    // 日期项点击
    container.querySelectorAll('.date-item').forEach(function(el) {
        el.addEventListener('click', function(e) {
            var dateVal = el.getAttribute('data-date');
            if(dateVal && reportsDB[dateVal]) {
                activeDate = dateVal;
                renderDateList();
                renderDailyContent(activeDate);
            }
        });
    });

    // 展开后调整 max-height 适配内容（仅对刚展开且非 none 的）
     container.querySelectorAll('.month-group-body').forEach(function(body) {
         if (body.style.maxHeight !== '0px' && body.style.maxHeight !== '0' && body.style.maxHeight !== 'none') {
             body.style.maxHeight = body.scrollHeight + 'px';
         }
     });
}

function getSourcesHtml(item) {
    var sources = item.sources;
    if (!sources) {
        if (item.source) {
            sources = [{ source: item.source, url: item.url || '' }];
        } else {
            return '';
        }
    }
    var html = '';
    var maxShow = 3;
    for (var i = 0; i < sources.length && i < maxShow; i++) {
        var s = sources[i];
        html += '<a class="brief-topic-source" href="' + (s.url || '') + '" target="_blank" rel="noopener">' + s.source + '</a>';
    }
    if (sources.length > maxShow) {
        html += '<span class="brief-topic-source-more">+' + (sources.length - maxShow) + '</span>';
    }
    return html;
}

function renderDailyContent(dateKey) {
    var report = reportsDB[dateKey];
    if(!report) {
        document.getElementById("dailyContentArea").innerHTML = '<div class="daily-inner"><div style="text-align:center; padding:60px; color:#999;">暂无日报数据</div></div>';
        return;
    }
    var topics = report.topics || [];
    var topicsHtml = '';
    topics.forEach(function(topic) {
        var itemsHtml = '';
        topic.items.forEach(function(item) {
            itemsHtml +=
                '<div class="brief-topic-item">' +
                    '<span class="brief-topic-bullet"></span>' +
                    '<span class="brief-topic-text">' + item.text + '</span>' +
                    '<span class="brief-topic-sources">' + getSourcesHtml(item) + '</span>' +
                '</div>';
        });
        topicsHtml +=
            '<div class="brief-topic-section">' +
                '<div class="brief-topic-title">' + topic.title + '</div>' +
                itemsHtml +
            '</div>';
    });
    var finalHtml =
        '<div class="daily-inner">' +
            '<div class="brief-title-area">' +
                 '<div class="brief-title-left">' +
                      '<span class="brief-update-time">' + dateKey.slice(0,4) + '年' + parseInt(dateKey.slice(5,7), 10) + '月' + parseInt(dateKey.slice(8,10), 10) + '日</span>' +
                      '<span class="brief-title-tag">每日晨报</span>' +
                      '<div class="brief-title-divider">' +
                          '<span></span>' +
                          '<span></span>' +
                      '</div>' +
                      '<span class="brief-desc-line">过去24小时动态 · AI自动聚合 · 每日8时推送</span>' +
                  '</div>' +
                '<div class="brief-title-actions">' +
                    '<button class="brief-action-btn" title="下载">' +
                        '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
                    '</button>' +
                    '<button class="brief-action-btn" title="分享">' +
                        '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>' +
                    '</button>' +
                '</div>' +
            '</div>' +
            '<div class="brief-summary-block">' +
                '<p class="brief-summary-text">' + report.summary + '</p>' +
            '</div>' +
            topicsHtml +
        '</div>';
    document.getElementById("dailyContentArea").innerHTML = finalHtml;
}

function toggleDailyPanel() {
    var panel = document.querySelector('.daily-left-panel');
    var toolbar = document.querySelector('.collapsed-toolbar');
    if (!panel) return;
    var isCollapsed = panel.classList.toggle('collapsed');
    if (toolbar) {
        toolbar.classList.toggle('show', isCollapsed);
    }
    var mainArea = document.querySelector('.daily-main-area');
    if (mainArea) {
        mainArea.style.width = isCollapsed ? '100%' : '';
    }
}

function init() {
    renderDateList();
    renderDailyContent(activeDate);
}
